services:
  nestjs-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - 3000:3000
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Video processing worker (FFmpeg) — consumes the BullMQ queue (phase 03, TD-05)
  video-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: npm run start:worker:dev
    restart: unless-stopped
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:17
    ports:
      # Host-side 5433 avoids collisions with other local Postgres instances;
      # inside the Compose network the service is still reached as db:5432.
      - "5433:5432"
    environment:
      - POSTGRES_USER=streamtube
      - POSTGRES_PASSWORD=streamtube
      - POSTGRES_DB=streamtube
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamtube"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  # Object storage (S3-compatible) — video files and thumbnails (phase 03, TD-03)
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=streamtube
      - MINIO_ROOT_PASSWORD=streamtube
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Message queue backend (BullMQ over Redis) — video processing jobs (phase 03, TD-01)
  redis:
    image: redis:7
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  minio-data:
  redis-data:
